name: Adaptive Meal Preview CI

on:
  push:
    branches:
      - feature/3313-2-adaptive-meal-preview
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Unit tests for adaptive meal modules
        run: ./gradlew :core:objects:testDebugUnitTest --tests "*OnlineMealLearnerTest*" --stacktrace

      - name: Build Full Debug APK
        run: ./gradlew :app:assembleFullDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aaps-3.3.1.3-adaptive-meal-preview-debug
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
